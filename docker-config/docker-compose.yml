services:
  mysql:
    image: mysql:latest
    container_name: mysql01
    environment:
      - MYSQL_ROOT_PASSWORD=test
      - MYSQL_DATABASE=mydb
    # command: --ssl=off
    ports:
      - "3306:3306"
    volumes:
      - /home/work/yunqi/database:/var/lib/mysql
  
networks:
  message_network:
    driver: bridge

volumes:
  mysql_data: