x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILES:-3}

x-backend-service: &backend-service
  image: deep-data-agent-backend:local
  build:
    context: ..
    dockerfile: data_agent/Dockerfile
  env_file:
    - path: ../.env
      required: false
  environment: &backend-environment
    MODEL_NAME: ${MODEL_NAME:-kimi-k2-turbo-preview}
    MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.moonshot.cn/v1}
    MODEL_TEMPERATURE: ${MODEL_TEMPERATURE:-0.3}
    DATABASE_URL: ${COMPOSE_DATABASE_URL:-mysql+pymysql://root:test@mysql:3306/mydb}
    REDIS_URL: ${COMPOSE_REDIS_URL:-redis://redis:6379/0}
    REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-1.0}
    FILE_STORAGE_ROOT: ${COMPOSE_FILE_STORAGE_ROOT:-/data/managed-files}
    FILE_UPLOAD_MAX_BYTES: ${FILE_UPLOAD_MAX_BYTES:-5242880}
    FILE_UPLOAD_BATCH_MAX_BYTES: ${FILE_UPLOAD_BATCH_MAX_BYTES:-10485760}
    FILE_UPLOAD_REQUEST_MAX_BYTES: ${FILE_UPLOAD_REQUEST_MAX_BYTES:-11534336}
    FILE_UPLOAD_BATCH_MAX_COUNT: ${FILE_UPLOAD_BATCH_MAX_COUNT:-5}
    FILE_USER_QUOTA_BYTES: ${FILE_USER_QUOTA_BYTES:-104857600}
    FILE_USER_MAX_COUNT: ${FILE_USER_MAX_COUNT:-100}
    FILE_RETENTION_HOURS: ${FILE_RETENTION_HOURS:-168}
    FILE_ANALYSIS_MAX_CHARS: ${FILE_ANALYSIS_MAX_CHARS:-20000}
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
    JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ENABLE_CODE_EXECUTION: ${ENABLE_CODE_EXECUTION:-false}
    SERVICE_NAME: ${SERVICE_NAME:-deep-data-agent}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    LOG_FILE_PATH: ${LOG_FILE_PATH:-deep_data_agent.log}
    LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10485760}
    LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-3}
    RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
    RATE_LIMIT_AUTH_MAX_REQUESTS: ${RATE_LIMIT_AUTH_MAX_REQUESTS:-10}
    RATE_LIMIT_AUTH_WINDOW_SECONDS: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:-60}
    RATE_LIMIT_QUERY_MAX_REQUESTS: ${RATE_LIMIT_QUERY_MAX_REQUESTS:-20}
    RATE_LIMIT_QUERY_WINDOW_SECONDS: ${RATE_LIMIT_QUERY_WINDOW_SECONDS:-60}
    RATE_LIMIT_SESSION_MAX_REQUESTS: ${RATE_LIMIT_SESSION_MAX_REQUESTS:-60}
    RATE_LIMIT_SESSION_WINDOW_SECONDS: ${RATE_LIMIT_SESSION_WINDOW_SECONDS:-60}
    RATE_LIMIT_DEFAULT_MAX_REQUESTS: ${RATE_LIMIT_DEFAULT_MAX_REQUESTS:-120}
    RATE_LIMIT_DEFAULT_WINDOW_SECONDS: ${RATE_LIMIT_DEFAULT_WINDOW_SECONDS:-60}
  logging: *bounded-logging
  volumes:
    - managed_file_data:/data/managed-files
  networks:
    - deep_data_network
  restart: unless-stopped

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-test}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mydb}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - deep_data_network
    logging: *bounded-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - deep_data_network
    logging: *bounded-logging
    restart: unless-stopped

  fastapi:
    <<: *backend-service
    command:
      [
        "uvicorn",
        "data_agent.agent_server:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    environment:
      <<: *backend-environment
      FASTAPI_HOST: 0.0.0.0
      FASTAPI_PORT: 8000
      SERVICE_NAME: fastapi
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  langgraph:
    <<: *backend-service
    command:
      [
        "langgraph",
        "dev",
        "--host",
        "0.0.0.0",
        "--port",
        "2024",
        "--no-browser",
        "--no-reload",
        "--allow-blocking",
        "--config",
        "langgraph.json",
      ]
    ports:
      - "${LANGGRAPH_PORT:-2024}:2024"
    environment:
      <<: *backend-environment
      SERVICE_NAME: langgraph
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2024/info', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  frontend:
    image: deep-data-agent-frontend:local
    build:
      context: ../agent_chatui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:2024}
        NEXT_PUBLIC_ASSISTANT_ID: ${NEXT_PUBLIC_ASSISTANT_ID:-agent}
        NEXT_PUBLIC_REST_API_URL: ${NEXT_PUBLIC_REST_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      fastapi:
        condition: service_healthy
      langgraph:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/data_copilot/",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - deep_data_network
    logging: *bounded-logging
    restart: unless-stopped

networks:
  deep_data_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  managed_file_data:
