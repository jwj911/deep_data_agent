# Alembic configuration for Deep Data Agent.
#
# The database URL is intentionally NOT hard-coded here. migrations/env.py
# injects it from the application configuration via
# data_agent.config.database._database_url(), so a single source of truth
# (DATABASE_URL) drives both the app and migrations.

[alembic]
# Path to migration scripts, relative to this file.
script_location = migrations

# Prepend the current working directory to sys.path so env.py can import the
# data_agent package when running the alembic CLI from the project root.
prepend_sys_path = .

# Split multiple version locations on os.pathsep (default for new projects).
version_path_separator = os
path_separator = os

# sqlalchemy.url is provided at runtime by migrations/env.py. Leave it unset
# here so no credentials or placeholders are committed to the repository.
# sqlalchemy.url =


[post_write_hooks]
# No post-write hooks are configured.


# Logging configuration.
#
# migrations/env.py deliberately does NOT call logging.config.fileConfig, so
# these sections do not override the application's structured logging defined
# in data_agent.config.logger. They are kept minimal for the rare case the
# alembic CLI is used with an explicit fileConfig call.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
