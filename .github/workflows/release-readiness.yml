name: Release Readiness

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -B -m pytest -q

      - name: Check backend import order
        run: python -m isort --check-only data_agent tests scripts

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent_chatui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm 10.5.1
        uses: pnpm/action-setup@v4
        with:
          version: "10.5.1"
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: agent_chatui/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend type check
        run: pnpm typecheck

      - name: Run frontend lint
        run: pnpm lint

      - name: Check frontend formatting
        run: pnpm format:check

      - name: Build frontend
        run: pnpm build

  contracts:
    name: Release Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check patch whitespace
        run: git diff --check

      - name: Validate Docker Compose configuration
        run: >-
          docker compose --env-file .env.example
          -f docker-config/docker-compose.yml config --quiet

      - name: Check release contracts
        run: python scripts/check_release_contracts.py
