name: Release Readiness

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHON_DOTENV_DISABLED: "1"
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.txt

      - name: Run backend tests
        run: python -B -m pytest -q

      - name: Check backend import order
        run: python -m isort --check-only data_agent tests scripts

      - name: Verify dependency lock and runtime support
        run: python scripts/verify_runtime_lock.py --check-support

      - name: Verify aggregate budget with actual SDK TCP requests
        run: |
          docker pull redis:7-alpine
          python -B scripts/verify_agent_budget_http.py --isolated-redis

      - name: Verify real MySQL schema refusal
        run: |
          docker pull mysql:8.4
          python scripts/verify_mysql_schema.py

      - name: Prepare pinned recovery verifier
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/dda-recovery-tools" "$RUNNER_TEMP/dda-recovery-work" "$RUNNER_TEMP/dda-recovery-evidence"
          timeout 120s gh release download v0.19.1 --repo restic/restic \
            --pattern restic_0.19.1_linux_amd64.bz2 --dir "$RUNNER_TEMP/dda-recovery-tools"
          python -B scripts/restic_release.py \
            --archive "$RUNNER_TEMP/dda-recovery-tools/restic_0.19.1_linux_amd64.bz2" \
            --output "$RUNNER_TEMP/dda-recovery-tools/restic"

      - name: Verify Linux recovery refusal and atomic publication
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s python -B scripts/verify_recovery_admission.py \
            --work-dir "$RUNNER_TEMP/dda-recovery-work" \
            --restic "$RUNNER_TEMP/dda-recovery-tools/restic" \
            --output "$RUNNER_TEMP/dda-recovery-evidence/admission.json"

      - name: Verify encrypted recovery and offline model controls
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s python -B scripts/verify_production_support.py \
            --work-dir "$RUNNER_TEMP/dda-recovery-work" \
            --restic "$RUNNER_TEMP/dda-recovery-tools/restic" \
            --output "$RUNNER_TEMP/dda-recovery-evidence/support.json"

      - name: Retain sanitized recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: recovery-controls-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dda-recovery-evidence/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Clean recovery verifier resources
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/dda-recovery-tools" "$RUNNER_TEMP/dda-recovery-work"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent_chatui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm 10.5.1
        uses: pnpm/action-setup@v4
        with:
          version: "10.5.1"
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: agent_chatui/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend type check
        run: pnpm typecheck

      - name: Run frontend lint
        run: pnpm lint

      - name: Check frontend formatting
        run: pnpm format:check

      - name: Build frontend
        run: pnpm build

  contracts:
    name: Release Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check patch whitespace
        run: git diff --check

      - name: Validate Docker Compose configuration
        run: >-
          docker compose --env-file .env.example
          -f docker-config/docker-compose.yml config --quiet

      - name: Check release contracts
        run: python scripts/check_release_contracts.py

  container-smoke:
    name: Container Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_ENV_FILE: ${{ github.workspace }}/.env
      COMPOSE_FILE: docker-config/docker-compose.yml
      COMPOSE_PROJECT_NAME: dda-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked out target SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(timeout 10s git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Create isolated CI configuration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          model_key="ci-model-$(openssl rand -hex 16)"
          search_key="ci-search-$(openssl rand -hex 16)"
          jwt_key="$(openssl rand -hex 32)"
          database_password="$(openssl rand -hex 24)"
          database_name="smoke_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            printf 'MOONSHOT_API_KEY=%s\n' "$model_key"
            printf 'TAVILY_API_KEY=%s\n' "$search_key"
            printf 'MODEL_NAME=ci-disabled-model\n'
            printf 'MODEL_BASE_URL=http://127.0.0.1:9/v1\n'
            printf 'MODEL_TEMPERATURE=0\n'
            printf 'MYSQL_ROOT_PASSWORD=%s\n' "$database_password"
            printf 'MYSQL_DATABASE=%s\n' "$database_name"
            printf 'COMPOSE_DATABASE_URL=mysql+pymysql://root:%s@mysql:3306/%s\n' \
              "$database_password" "$database_name"
            printf 'COMPOSE_REDIS_URL=redis://redis:6379/0\n'
            printf 'JWT_SECRET_KEY=%s\n' "$jwt_key"
            printf 'JWT_ACCESS_TOKEN_EXPIRE_MINUTES=5\n'
            printf 'CORS_ALLOWED_ORIGINS=http://localhost:3000\n'
            printf 'RATE_LIMIT_ENABLED=false\n'
            printf 'NEXT_PUBLIC_API_URL=http://localhost:2024\n'
            printf 'NEXT_PUBLIC_ASSISTANT_ID=agent\n'
            printf 'NEXT_PUBLIC_REST_API_URL=http://localhost:8000\n'
            printf 'DOCKER_LOG_MAX_SIZE=10m\n'
            printf 'DOCKER_LOG_MAX_FILES=3\n'
          } > "$CI_ENV_FILE"

      - name: Build images and verify empty database
        id: build_smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s docker compose \
            --env-file "$CI_ENV_FILE" \
            -f "$COMPOSE_FILE" \
            -p "$COMPOSE_PROJECT_NAME" \
            up --build -d --wait --wait-timeout 300
          timeout 120s python scripts/verify_container_smoke.py \
            --compose-file "$COMPOSE_FILE" \
            --env-file "$CI_ENV_FILE" \
            --project-name "$COMPOSE_PROJECT_NAME" \
            verify --scenario empty

      - name: Verify static authentication redirects
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s python scripts/verify_static_frontend_http.py \
            --base-url http://127.0.0.1:3000

      - name: Verify Redis stop and recovery
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s python scripts/verify_container_smoke.py \
            --compose-file "$COMPOSE_FILE" \
            --env-file "$CI_ENV_FILE" \
            --project-name "$COMPOSE_PROJECT_NAME" \
            redis-canary

      - name: Verify actual browser authentication and conversation
        shell: bash
        run: |
          set -euo pipefail
          browser_dir="$RUNNER_TEMP/dda-browser"
          npm install --prefix "$browser_dir" --no-audit --no-fund playwright@1.64.1
          "$browser_dir/node_modules/.bin/playwright" install --with-deps chromium
          timeout 600s python scripts/verify_browser_smoke.py \
            --compose-file "$COMPOSE_FILE" \
            --env-file "$CI_ENV_FILE" \
            --project-name "$COMPOSE_PROJECT_NAME" \
            --playwright-module "$browser_dir/node_modules/playwright/index.mjs" \
            --scratch-root "$RUNNER_TEMP"

      - name: Verify three-domain backup and fresh restore
        if: ${{ !cancelled() && steps.build_smoke.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          timeout 600s python scripts/verify_data_recovery.py \
            --compose-file "$COMPOSE_FILE" \
            --env-file "$CI_ENV_FILE" \
            --project-name "$COMPOSE_PROJECT_NAME"

      - name: Verify restart at migration head
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s python scripts/verify_container_smoke.py \
            --compose-file "$COMPOSE_FILE" \
            --env-file "$CI_ENV_FILE" \
            --project-name "$COMPOSE_PROJECT_NAME" \
            seed-head
          timeout 60s docker compose \
            --env-file "$CI_ENV_FILE" \
            -f "$COMPOSE_FILE" \
            -p "$COMPOSE_PROJECT_NAME" \
            restart --timeout 10 fastapi
          timeout 360s docker compose \
            --env-file "$CI_ENV_FILE" \
            -f "$COMPOSE_FILE" \
            -p "$COMPOSE_PROJECT_NAME" \
            up -d --wait --wait-timeout 300
          timeout 120s python scripts/verify_container_smoke.py \
            --compose-file "$COMPOSE_FILE" \
            --env-file "$CI_ENV_FILE" \
            --project-name "$COMPOSE_PROJECT_NAME" \
            verify --scenario head

      - name: Verify upgrade from known legacy baseline
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s docker compose \
            --env-file "$CI_ENV_FILE" \
            -f "$COMPOSE_FILE" \
            -p "$COMPOSE_PROJECT_NAME" \
            down --volumes --remove-orphans --timeout 10
          timeout 360s docker compose \
            --env-file "$CI_ENV_FILE" \
            -f "$COMPOSE_FILE" \
            -p "$COMPOSE_PROJECT_NAME" \
            up -d --wait --wait-timeout 300 mysql redis
          timeout 120s python scripts/verify_container_smoke.py \
            --compose-file "$COMPOSE_FILE" \
            --env-file "$CI_ENV_FILE" \
            --project-name "$COMPOSE_PROJECT_NAME" \
            prepare-legacy
          timeout 360s docker compose \
            --env-file "$CI_ENV_FILE" \
            -f "$COMPOSE_FILE" \
            -p "$COMPOSE_PROJECT_NAME" \
            up -d --wait --wait-timeout 300
          timeout 120s python scripts/verify_container_smoke.py \
            --compose-file "$COMPOSE_FILE" \
            --env-file "$CI_ENV_FILE" \
            --project-name "$COMPOSE_PROJECT_NAME" \
            verify --scenario legacy

      - name: Print bounded redacted diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          timeout 210s python scripts/verify_container_smoke.py \
            --compose-file "$COMPOSE_FILE" \
            --env-file "$CI_ENV_FILE" \
            --project-name "$COMPOSE_PROJECT_NAME" \
            diagnostics || true

      - name: Clean up container smoke resources
        if: ${{ always() }}
        shell: bash
        run: |
          timeout 60s docker compose \
            --env-file "$CI_ENV_FILE" \
            -f "$COMPOSE_FILE" \
            -p "$COMPOSE_PROJECT_NAME" \
            down --volumes --remove-orphans --timeout 10 || true
          rm -f "$CI_ENV_FILE"
